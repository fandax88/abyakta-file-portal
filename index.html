<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyakta Lab Repository — Software &amp; File Portal</title>
    <meta
      name="description"
      content="Portal repositori perangkat lunak, modul praktikum, image ISO, dan skrip laboratorium Abyakta Lab (file.abyakta-h.id)."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('abyakta_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-[var(--bg-canvas)] font-sans text-[var(--text-primary)] antialiased selection:bg-blue-500/20 selection:text-blue-700 dark:selection:bg-blue-400/25 dark:selection:text-blue-200">
    <div id="root" class="min-h-dvh flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
